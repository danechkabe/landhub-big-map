<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>LandHub Big Map</title>
    <meta
      name="description"
      content="Велика карта активних ділянок LandMatch Parcels."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-bar">
          <h1>LandHub Big Map</h1>
          <section class="filters" aria-label="Фільтри карти">
            <div class="range-filter" data-filter="area">
              <div class="filter-title">Площа ділянки</div>
              <div class="range-values">
                <span id="area-min-label">1 сотка</span>
                <span id="area-max-label">100 соток</span>
              </div>
              <div class="range-slider">
                <div id="area-range-fill" class="range-fill"></div>
                <input id="area-min" type="range" min="1" max="100" step="1" value="1" aria-label="Мінімальна площа" />
                <input id="area-max" type="range" min="1" max="100" step="1" value="100" aria-label="Максимальна площа" />
              </div>
            </div>
            <div class="range-filter" data-filter="price">
              <div class="filter-title">Ціна (за всю ділянку)</div>
              <div class="range-values">
                <span id="price-min-label">1000$</span>
                <span id="price-max-label">100 000$</span>
              </div>
              <div class="range-slider">
                <div id="price-range-fill" class="range-fill"></div>
                <input id="price-min" type="range" min="1000" max="100000" step="1000" value="1000" aria-label="Мінімальна ціна" />
                <input id="price-max" type="range" min="1000" max="100000" step="1000" value="100000" aria-label="Максимальна ціна" />
              </div>
            </div>
          </section>
        </div>
      </header>

      <main id="map-layout" class="map-layout">
        <section class="map-card" aria-label="Карта ділянок">
          <div id="map"></div>
        </section>

        <aside id="parcel-panel" class="parcel-panel" aria-live="polite" aria-hidden="true">
          <button id="panel-close" class="panel-close" type="button" aria-label="Закрити">
            ×
          </button>
          <div id="panel-content" class="panel-content">
            <div class="panel-empty">Оберіть ділянку на мапі.</div>
          </div>
        </aside>
      </main>
    </div>

    <div id="photo-lightbox" class="photo-lightbox" aria-hidden="true">
      <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Закрити">
        ×
      </button>
      <div class="lightbox-tools" aria-label="Керування фото">
        <button id="lightbox-zoom-in" type="button" aria-label="Наблизити">+</button>
        <button id="lightbox-zoom-out" type="button" aria-label="Віддалити">−</button>
        <button id="lightbox-zoom-reset" type="button" aria-label="Скинути масштаб">100%</button>
      </div>
      <div id="lightbox-stage" class="lightbox-stage">
        <img id="lightbox-image" alt="" />
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./app.js" defer></script>
  </body>
</html>

<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>LandHub Big Map</title>
    <meta
      name="description"
      content="Велика карта активних ділянок LandMatch Parcels."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-bar">
          <h1>LandHub Big Map</h1>
        </div>
      </header>

      <main id="map-layout" class="map-layout">
        <section class="map-card" aria-label="Карта ділянок">
          <div id="map"></div>
        </section>

        <aside id="parcel-panel" class="parcel-panel" aria-live="polite" aria-hidden="true">
          <button id="panel-close" class="panel-close" type="button" aria-label="Закрити">
            ×
          </button>
          <div id="panel-content" class="panel-content">
            <div class="panel-empty">Оберіть ділянку на мапі.</div>
          </div>
        </aside>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./app.js" defer></script>
  </body>
</html>
